name: pageprobe
on:
  push:
    branches: [page-run]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe/page_probe.py
      - run: |
          git config user.name "dc-watch-bot"
          git config user.email "dc-watch-bot@users.noreply.github.com"
          B="page-out-${{ github.run_number }}"
          git checkout -b "$B"
          git add -f probe/out
          git commit -m "page probe ${{ github.run_number }}"
          git push origin "$B"
