name: scan-permits
on:
  workflow_dispatch:
    inputs:
      sido: {description: "시도명(쉼표 구분, 비우면 전체)", required: false, default: ""}
      exclude: {description: "제외 시군구코드 접두", required: false, default: ""}
      since: {description: "대장 변경일 기준 시작일", required: false, default: "20200101"}
      attempt: {description: "서버 연결이 안 돼 다시 띄운 횟수(자동)", required: false, default: "1"}
  push:
    branches: [scan-run]
  schedule:
    - cron: "40 15 * * *"   # 매일 00:40 KST(공공데이터포털 일일 한도 초기화 직후) · 운영계정이라 하루 최대 6만 건까지
permissions:
  contents: write
  actions: write
concurrency: {group: scan, cancel-in-progress: false}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: scan
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          SIDO="${{ github.event.inputs.sido }}"; EXC="${{ github.event.inputs.exclude }}"; SINCE="${{ github.event.inputs.since }}"
          if [ -f scan.args ] && [ "${{ github.event_name }}" = "push" ]; then . ./scan.args; fi
          python collector/regions.py || true
          # 5천 건 또는 25분마다 끊어 저장 · 커밋해 진척이 저장소에 바로 보이게 한다.
          # 하루 호출 상한은 포털이 정한다(넘으면 LIMITED_NUMBER 응답 → quota로 멈추고 다음 날 0시 40분에 이어서).
          git config user.name "dc-watch-bot"; git config user.email "dc-watch-bot@users.noreply.github.com"
          CH=5000; STOP=""; i=0; START=$(date +%s)
          while :; do
            i=$((i+1))
            python collector/permits.py --sido "$SIDO" --exclude-sgg "$EXC" --since "${SINCE:-20200101}" --limit $CH --max-seconds 1500 --workers "${WORKERS:-3}" --only "${ONLY:-}" || true
            python collector/build.py || true
            git add data/permits.json data/state data/bjd_units.json site/data/dash.json || true
            git diff --cached --quiet || git commit -q -m "인허가 수집 $(date -u +%F) ($i)"
            git pull --rebase -X theirs -q origin main || true
            git push -q origin HEAD:main || true
            STOP=$(python -c "import json;print(json.load(open('data/state/permit_scan.json')).get('stop',''))")
            echo "chunk $i stop=$STOP"
            case "$STOP" in limit|time) ;; *) break ;; esac
            # 실행 시간 제한(340분) 전에 끊고 새 실행으로 이어 받는다
            if [ $(( $(date +%s) - START )) -gt 17400 ]; then STOP=continue; break; fi
          done
          echo "STOP=$STOP" >> "$GITHUB_ENV"
      - name: continue on a fresh run
        # 서버 연결이 막힌 실행 환경이면 새 실행으로 네 번까지, 시간이 다 돼 끊었으면 바로 이어서 새 실행을 띄운다
        if: (env.STOP == 'conn' && (github.event.inputs.attempt || '1') < '5') || env.STOP == 'continue'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$STOP" = conn ]; then N=$(( ${{ github.event.inputs.attempt || '1' }} + 1 )); else N=1; fi
          sleep 60
          gh workflow run scan.yml --ref main -f attempt=$N -f since="${{ github.event.inputs.since || '20200101' }}"
      - name: commit
        if: always()
        run: |
          git config user.name "dc-watch-bot"; git config user.email "dc-watch-bot@users.noreply.github.com"
          git add data/permits.json data/state data/bjd_units.json site/data/dash.json || true
          git diff --cached --quiet || git commit -m "인허가 수집 $(date -u +%F)"
          git pull --rebase -X theirs -q origin main || true
          git push origin HEAD:main
