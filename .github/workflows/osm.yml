name: osm
on:
  push:
    branches: [osm-run]
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/osm_substations.py
      - run: |
          git config user.name "dc-watch-bot"; git config user.email "dc-watch-bot@users.noreply.github.com"
          git checkout -b osm-out-${{ github.run_number }}
          git add -f probe/out/osm_subs.json && git commit -q -m "osm substations" && git push -q origin HEAD
